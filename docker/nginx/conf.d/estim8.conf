# --- HTTP: ACME challenge + redirect to HTTPS ---
server {
    listen 80;
    server_name estim8.com www.estim8.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: reverse proxy to the Node/Express + Socket.IO server ---
# NOTE: this block requires certificates to already exist at the paths below.
# On first deploy (before certs are issued), comment out this entire server
# block, bring the stack up, run the certbot one-shot command described in
# the README to obtain the certificate, then uncomment this block and reload
# nginx (`docker compose exec nginx nginx -s reload`).
server {
    listen 443 ssl;
    http2 on;
    server_name estim8.com www.estim8.com;

    ssl_certificate /etc/letsencrypt/live/estim8.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/estim8.com/privkey.pem;

    client_max_body_size 25m;

    location /socket.io/ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
